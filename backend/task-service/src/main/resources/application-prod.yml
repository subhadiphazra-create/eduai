spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connectionTimeout: 20000
      maximumPoolSize: 50

  jpa:
    show-sql: false

server:
  port: ${PORT:8081}

logging:
  level:
    root: WARN
    com.eduai.auth: INFO