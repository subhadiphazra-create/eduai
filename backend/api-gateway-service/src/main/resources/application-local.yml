# ─────────────────────────────────────────────────────────
#  LOCAL DEVELOPMENT PROFILE
#  Activate with: --spring.profiles.active=local
#  Or set env var: SPRING_PROFILES_ACTIVE=local
# ─────────────────────────────────────────────────────────

spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**

        - id: task-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/tasks/**

        - id: mail-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/mail/**

  data:
    redis:
      host: localhost
      port: 6379
      password:   # No password for local Redis

server:
  port: 8080

jwt:
  secret: local-dev-secret-key-replace-before-any-deployment-min-256-bits
  expiration-ms: 86400000
  refresh-expiration-ms: 604800000

logging:
  level:
    root: DEBUG
    com.starter.gateway: DEBUG
    org.springframework.cloud.gateway: TRACE
    org.springframework.security: DEBUG
