spring:
  application:
    name: api-gateway

  # Spring Cloud Gateway Routes
  cloud:
    gateway:
      routes:
        # ─── Auth Service ───────────────────────────────────────────────────
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=0
            # TODO: Add rate-limiting filter
            # - name: RequestRateLimiter
            #   args:
            #     redis-rate-limiter.replenishRate: 10
            #     redis-rate-limiter.burstCapacity: 20

        # ─── Task Service ────────────────────────────────────────────────────
        - id: task-service
          uri: ${TASK_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/tasks/**
          filters:
            - StripPrefix=0

        # ─── Mail Service ────────────────────────────────────────────────────
        - id: mail-service
          uri: ${MAIL_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/mail/**
          filters:
            - StripPrefix=0

      # Global CORS configuration
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - ${ALLOWED_ORIGINS:http://localhost:3000}
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600

      # Default filters applied to all routes
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

  # Redis (for rate-limiting and token blacklist)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# Server configuration
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# JWT configuration (for gateway-level validation)
jwt:
  secret: ${JWT_SECRET:REPLACE_WITH_A_STRONG_SECRET_MIN_256_BITS}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}    # 24 hours
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}  # 7 days

# Logging
logging:
  level:
    root: INFO
    com.starter.gateway: INFO
    org.springframework.cloud.gateway: INFO
